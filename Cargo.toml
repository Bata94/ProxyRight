[package]
name = "ProxyRight"
version = "0.1.0"
edition = "2024"

[lib]
name = "ProxyRight"
path = "src/lib.rs"

[[bin]]
name = "ProxyRight"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
http = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.5"
reqwest = { version = "0.11", features = ["json"] }
mime_guess = "2.0"
chrono = "0.4"
base64 = "0.21"
governor = "0.5"
nonzero_ext = "0.3"

[dev-dependencies]
mockito = "1.7"
tempfile = "3.21.0"
